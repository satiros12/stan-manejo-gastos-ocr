<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card-bg: #14141f;
      --text: #e8e8f0;
      --text-dim: #6b6b8a;
      --accent: #0f8a5f;
      --accent-glow: rgba(15, 138, 95, 0.4);
      --border: #2a2a3a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      height: 100vh;
    }

    /* ─── Header ───────────────────────────────────────────── */
    header {
      padding: 1.8rem 2rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    .hint {
      display: flex; gap: 0.6rem; font-size: 0.75rem;
      color: var(--text-dim); align-items: center;
    }
    .hint kbd {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.1rem 0.4rem;
      font-family: inherit; font-size: 0.7rem; color: var(--text);
    }

    /* ─── Grid ─────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
      padding: 1.2rem 2rem 2rem;
      height: calc(100vh - 80px);
      overflow-y: auto;
      scrollbar-width: none;
      align-content: start;
    }
    #grid::-webkit-scrollbar { display: none; }

    /* ─── Tile ─────────────────────────────────────────────── */
    .tile {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 150px;
      outline: none;
      transition: all 0.12s ease;
      padding: 1.5rem 1rem 1rem;
    }
    .tile .ico { font-size: 3rem; line-height: 1; }
    .tile .nm { font-size: 1rem; font-weight: 600; text-align: center; }
    .tile .desc { font-size: 0.7rem; color: var(--text-dim); text-align: center; }

    .tile:focus,
    .tile.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent), 0 0 25px var(--accent-glow);
      transform: scale(1.06);
      z-index: 2;
    }
    .tile.focused .ico { animation: pulse 1.4s ease-in-out infinite; }
    .tile.pressed { transform: scale(0.93); }

    /* ─── Overlays ─────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; transition: opacity 0.3s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-content { text-align: center; }
    .overlay-content .big-icon { font-size: 4rem; margin-bottom: 1rem; }
    .overlay-content h2 { font-size: 1.8rem; margin-bottom: 0.4rem; }
    .overlay-content p { color: var(--text-dim); font-size: 1rem; }
    .dots { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; }
    .dots .d {
      width: 10px; height: 10px; background: var(--accent);
      border-radius: 50%; animation: bounce 1.4s ease-in-out infinite;
    }
    .dots .d:nth-child(2) { animation-delay: 0.2s; }
    .dots .d:nth-child(3) { animation-delay: 0.4s; }

    /* ─── Status toast ─────────────────────────────────────── */
    #toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      padding: 1.2rem 2.5rem; border-radius: 1rem;
      border: 1px solid var(--accent);
      font-size: 1.1rem; z-index: 150;
      transition: opacity 0.25s; text-align: center;
    }
    #toast.hidden { opacity: 0; pointer-events: none; }

    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-12px)} }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Launcher</h1>
    <div class="hint">
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> Navegar</span>
      <span><kbd>A</kbd> Abrir</span>
      <span><kbd>B</kbd> Atrás</span>
      <span><kbd>START</kbd> Salir</span>
    </div>
  </header>

  <div id="grid"></div>

  <div id="toast" class="hidden"></div>

  <div id="no-controller" class="overlay">
    <div class="overlay-content">
      <div class="big-icon">🎮</div>
      <h2>Conecta un mando</h2>
      <p>Usa un controlador Xbox, PlayStation o compatible</p>
      <div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div></div>
    </div>
  </div>

<script>
// ─── APP CONFIG ────────────────────────────────────────────────────
const APPS = [
  { id:"netflix",  name:"Netflix",   icon:"🎬", color:"#E50914", url:"https://netflix.com",        desc:"Series y películas" },
  { id:"hbo",      name:"HBO Max",   icon:"🟣", color:"#5822B4", url:"https://hbomax.com",         desc:"Series y películas" },
  { id:"disney",   name:"Disney+",   icon:"✨", color:"#113CCF", url:"https://disneyplus.com",     desc:"Series y películas" },
  { id:"prime",    name:"Prime Video",icon:"🎥", color:"#00A8E1", url:"https://primevideo.com",     desc:"Series y películas" },
  { id:"youtube",  name:"YouTube",   icon:"▶️", color:"#FF0000", url:"https://youtube.com",        desc:"Videos" },
  { id:"twitch",   name:"Twitch",    icon:"📺", color:"#9146FF", url:"https://twitch.tv",          desc:"Streaming en vivo" },
  { id:"spotify",  name:"Spotify",   icon:"🎵", color:"#1DB954", url:"https://open.spotify.com",   desc:"Música" },
  { id:"plex",     name:"Plex",      icon:"📀", color:"#E5A00D", url:"http://localhost:32400/web", desc:"Biblioteca media" },
  { id:"steam",    name:"Steam",     icon:"🎮", color:"#1b2838", url:"steam://open/games",         desc:"Juegos", isProtocol:true },
];

// ─── RENDER TILES ──────────────────────────────────────────────────
const grid = document.getElementById("grid");
APPS.forEach((app, i) => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.tabIndex = -1;
  tile.dataset.index = i;
  tile.innerHTML = `
    <div class="ico">${app.icon}</div>
    <div class="nm">${app.name}</div>
    <div class="desc">${app.desc}</div>
  `;
  tile.addEventListener("click", () => launchApp(i));
  tile.addEventListener("mouseenter", () => focusTile(i));
  grid.appendChild(tile);
});

// ─── NAVIGATION STATE ──────────────────────────────────────────────
let focusIndex = 0;
const tiles = document.querySelectorAll(".tile");
const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length || 4;

function focusTile(i) {
  tiles.forEach(t => t.classList.remove("focused"));
  focusIndex = Math.max(0, Math.min(i, tiles.length - 1));
  tiles[focusIndex].classList.add("focused");
  tiles[focusIndex].scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function moveFocus(dx, dy) {
  const row = Math.floor(focusIndex / cols);
  const col = focusIndex % cols;
  let ni = focusIndex;

  if (dy !== 0) {
    ni = Math.max(0, Math.min(tiles.length - 1, focusIndex + dy * cols));
  }
  if (dx !== 0) {
    ni = Math.max(0, Math.min(tiles.length - 1, focusIndex + dx));
  }
  if (ni !== focusIndex) focusTile(ni);
}

// ─── LAUNCH APP ────────────────────────────────────────────────────
function showToast(msg, duration = 2000) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add("hidden"), duration);
}

function launchApp(i) {
  const app = APPS[i];
  if (!app) return;
  showToast(`Abriendo ${app.name}…`, 1500);

  // Try local agent (Express server) first
  fetch(`http://localhost:3457/api/launch?id=${app.id}`, { method: "POST" })
    .catch(() => {
      // No server → browser-only mode
      if (app.isProtocol || app.url.startsWith("steam://")) {
        window.location.href = app.url;
      } else {
        openService(app.url);
      }
    });
}

function openService(url) {
  // Open in new window sized to screen
  const w = window.open(url, "_blank",
    `width=${screen.width},height=${screen.height},menubar=no,toolbar=no,location=no`);
  if (w) {
    try { w.moveTo(0, 0); } catch {}
  } else {
    // Popup blocked → navigate same window
    window.location.href = url;
  }
}

// ─── GAMEPAD API ───────────────────────────────────────────────────
const noCtrl = document.getElementById("no-controller");

function gamepadLoop() {
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;

  if (!gp) {
    noCtrl.classList.remove("hidden");
    requestAnimationFrame(gamepadLoop);
    return;
  }
  noCtrl.classList.add("hidden");

  // Button aliases
  const A = 0, B = 1, X = 2, Y = 3, LB = 4, RB = 5;
  const BACK = 8, START = 9, L3 = 10, R3 = 11;
  const DPAD_UP = 12, DPAD_DOWN = 13, DPAD_LEFT = 14, DPAD_RIGHT = 15;

  // Read buttons (gamepad.buttons is an array)
  const btns = gp.buttons;

  // D-pad
  const axisDead = 0.4;
  const lx = gp.axes[0] || 0;
  const ly = gp.axes[1] || 0;

  // D-pad buttons or analog stick
  if (btns[DPAD_LEFT]?.pressed || lx < -axisDead) moveFocus(-1, 0);
  if (btns[DPAD_RIGHT]?.pressed || lx > axisDead) moveFocus(1, 0);
  if (btns[DPAD_UP]?.pressed || ly < -axisDead) moveFocus(0, -1);
  if (btns[DPAD_DOWN]?.pressed || ly > axisDead) moveFocus(0, 1);

  // A button → launch
  if (btns[A]?.pressed && !window._aPrev) {
    launchApp(focusIndex);
    tiles[focusIndex]?.classList.add("pressed");
    setTimeout(() => tiles[focusIndex]?.classList.remove("pressed"), 150);
  }

  // B button → back (close current service or go to launcher)
  if (btns[B]?.pressed && !window._bPrev) {
    showToast("↩ Volviendo al lanzador", 800);
  }

  // START → exit hint
  if (btns[START]?.pressed && !window._startPrev) {
    showToast("Presiona Alt+F4 o cierra la ventana para salir", 2000);
  }

  window._aPrev = btns[A]?.pressed || false;
  window._bPrev = btns[B]?.pressed || false;
  window._startPrev = btns[START]?.pressed || false;

  // Throttle: ~30fps for gamepad scanning
  setTimeout(() => requestAnimationFrame(gamepadLoop), 33);
}

// ─── KEYBOARD FALLBACK ─────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  switch (e.key) {
    case "ArrowLeft":  e.preventDefault(); moveFocus(-1, 0); break;
    case "ArrowRight": e.preventDefault(); moveFocus(1, 0);  break;
    case "ArrowUp":    e.preventDefault(); moveFocus(0, -1); break;
    case "ArrowDown":  e.preventDefault(); moveFocus(0, 1);  break;
    case "Enter": case " ": e.preventDefault(); launchApp(focusIndex); break;
    case "Escape": showToast("Presiona Alt+F4 para salir", 1500); break;
  }
});

// ─── INIT ──────────────────────────────────────────────────────────
focusTile(0);
gamepadLoop();

// ─── DETECT WINDOWS KIOSK LAUNCH ───────────────────────────────────
if (window.location.search.includes("kiosk")) {
  document.documentElement.requestFullscreen?.();
}
</script>
</body>
</html>
